# Lint, type check and both test suites on every push and pull request.
#
# Two jobs, split by what they need:
#
#   check        lint, type check, unit and API tests — no database, well under a minute
#   integration  the Cypher against a real Neo4j, started by Testcontainers
#
# They run in parallel, so the slow job does not hold up the fast feedback of the other.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The settings are mandatory and read at import time — `main.py` builds the app before the
# first test runs. The values are throwaway: the unit and API tests open no connection, and
# the integration tests connect to their own container, not to NEO4J_URI.
env:
  NEO4J_URI: neo4j://localhost:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: not-used-no-test-connects
  JWT_SECRET_KEY: ci-only-secret-long-enough-for-hs256-signing

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pinned to the version uv.lock was generated with, so CI resolves exactly what
          # was tested locally rather than whatever is newest on the day it runs.
          version: "0.11.31"
          enable-cache: true

      - name: Install dependencies
        # --locked aborts when uv.lock no longer matches pyproject.toml. A CI run must not
        # silently resolve differently from the lock file under review.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Unit and API tests
        # Deliberately not a bare `pytest`: that would collect tests/integration/ as well
        # and start a container in the job meant to stay fast.
        run: uv run poe test

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Integration tests
        # The runner brings Docker along; Testcontainers pulls neo4j:5-community and
        # removes the container afterwards. `CI` is set by GitHub Actions, which turns a
        # container that fails to start into an error rather than a skip — a skipped
        # suite would look exactly like a passing one.
        run: uv run poe test-integration
