# Brings up the database and the backend together.
#
#   cp .env.example .env                      adjust the password and the JWT secret
#   docker compose up -d                      neo4j + backend
#   docker compose --profile seed up seed     once, for the demo data
#
# The seed sits behind a profile on purpose: it is a one-shot job, and a service that
# reran on every `up` would be a surprise waiting to happen — the file is idempotent, but
# nobody expects a start command to touch data.

services:
  neo4j:
    image: neo4j:5-community
    container_name: graphforge-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      # Only NEO4J_AUTH. The image reads every other NEO4J_* variable as a configuration
      # key and refuses to start on one it does not know — a second variable carrying the
      # password would take the database down with "No declared setting with name".
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j-data:/data
    healthcheck:
      # The password is substituted by compose (single $), not read inside the container —
      # see the note on the environment above.
      #
      # The backend verifies the connection on startup and would exit if the database were
      # not up yet. `depends_on: service_healthy` waits for this check instead.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: graphforge-backend
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Inside the compose network the database answers under its service name, not under
      # localhost — a URI copied from a local .env is the classic reason the container
      # starts and then cannot connect.
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  seed:
    profiles: ["seed"]
    image: neo4j:5-community
    container_name: graphforge-seed
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./seed.cypher:/seed.cypher:ro
    # Runs once and exits. Every write in the file is a MERGE on a business key, so a
    # second run yields the same graph rather than duplicates.
    command:
      - cypher-shell
      - -a
      - neo4j://neo4j:7687
      - -u
      - neo4j
      - -p
      - ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - -f
      - /seed.cypher

volumes:
  neo4j-data:
